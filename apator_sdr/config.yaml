name: Apator SDR
version: "0.1.4"
slug: apator_sdr
description: Odečet Apator Metra E-ITN 30.2 (teplo) a E-RM 30 (vodoměr) přes RTL-SDR na 868.95 MHz
url: https://github.com/vajny/apator-sdr
arch:
  - aarch64
  - amd64
  - armv7
usb: true
udev: true
init: false
startup: services
boot: auto
hassio_api: true
hassio_role: default
privileged:
  - SYS_RAWIO
services:
  - mqtt:need
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:radiator
panel_title: Apator
watchdog: "http://[HOST]:[PORT:8099]/health"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Web (když nepoužiješ ingress)
options:
  frequency: "868.95M"
  gain: "40.2"
  sample_rate: "1024k"
  devices: []
schema:
  frequency: str
  gain: str
  sample_rate: str
  devices:
    - serial: str
      name: str?
      model: list(E-ITN30|E-RM30)
map:
  - type: addon_config
    read_only: false
