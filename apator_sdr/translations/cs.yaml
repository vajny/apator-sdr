configuration:
  frequency:
    name: Frekvence
    description: Střed RTL-SDR. Apator Metra vysílá na 868.95M.
  gain:
    name: Zisk tuneru
    description: 0 = Auto (není to 0 dB). Číslo je dB, rtl_433 ho zarovná na krok tuneru.
  sample_rate:
    name: Vzorkování
  devices:
    name: Měřáky
    description: Sériové číslo z potisku (klidně 30731042/0922). E-ITN30 = topení, E-RM30 = vodoměr. Do MQTT jdou jen tyhle.
