configuration:
  frequency:
    name: Frekvence
    description: Střed RTL-SDR. Apator Metra vysílá na 868.95M.
  gain:
    name: Zisk tuneru
    description: U stupaček 17.9 (19.2 přebíjí blízké vodoměry). auto = AGC.
  sample_rate:
    name: Vzorkování
    description: 250k = užší pásmo, méně ruchy. 1024k jen když chybí slabé topení.
  devices:
    name: Měřáky
    description: Sériové číslo z potisku (klidně 30731042/0922). E-ITN30 = topení, E-RM30 = vodoměr. Do MQTT jdou jen tyhle.
